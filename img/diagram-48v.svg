<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagram sistem 48V dengan 4 baterai 12V dirangkai seri">
  <defs>
    <linearGradient id="d48-battery" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a4a30"/>
      <stop offset="1" stop-color="#0a2818"/>
    </linearGradient>
    <linearGradient id="d48-amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2b91c"/>
      <stop offset="1" stop-color="#d19b12"/>
    </linearGradient>
    <marker id="d48-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#f2b91c"/>
    </marker>
    <filter id="d48-glow">
      <feGaussianBlur stdDeviation="3"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="720" height="360" fill="#eef3e6" rx="20"/>

  <!-- grid dots background -->
  <g opacity=".08" fill="#0f3a26">
    <circle cx="60" cy="60" r="1.5"/><circle cx="120" cy="60" r="1.5"/><circle cx="180" cy="60" r="1.5"/>
    <circle cx="240" cy="60" r="1.5"/><circle cx="300" cy="60" r="1.5"/><circle cx="360" cy="60" r="1.5"/>
    <circle cx="420" cy="60" r="1.5"/><circle cx="480" cy="60" r="1.5"/><circle cx="540" cy="60" r="1.5"/>
    <circle cx="600" cy="60" r="1.5"/><circle cx="660" cy="60" r="1.5"/>
    <circle cx="60" cy="120" r="1.5"/><circle cx="120" cy="120" r="1.5"/><circle cx="180" cy="120" r="1.5"/>
    <circle cx="240" cy="120" r="1.5"/><circle cx="300" cy="120" r="1.5"/><circle cx="360" cy="120" r="1.5"/>
    <circle cx="420" cy="120" r="1.5"/><circle cx="480" cy="120" r="1.5"/><circle cx="540" cy="120" r="1.5"/>
    <circle cx="600" cy="120" r="1.5"/><circle cx="660" cy="120" r="1.5"/>
    <circle cx="60" cy="300" r="1.5"/><circle cx="120" cy="300" r="1.5"/><circle cx="180" cy="300" r="1.5"/>
    <circle cx="240" cy="300" r="1.5"/><circle cx="300" cy="300" r="1.5"/><circle cx="360" cy="300" r="1.5"/>
    <circle cx="420" cy="300" r="1.5"/><circle cx="480" cy="300" r="1.5"/><circle cx="540" cy="300" r="1.5"/>
    <circle cx="600" cy="300" r="1.5"/><circle cx="660" cy="300" r="1.5"/>
  </g>

  <!-- title kicker -->
  <text x="40" y="52" font-family="'Geist Mono', ui-monospace, monospace" font-weight="600" font-size="11" fill="#0f3a26" opacity=".55" letter-spacing="2">SISTEM SERIES · 48V SETUP</text>

  <!-- flow line background -->
  <path d="M 90 200 L 640 200" stroke="#f2b91c" stroke-width="2" stroke-dasharray="4 6" opacity=".4"/>

  <!-- 4 batteries -->
  <g>
    <!-- Battery 1 -->
    <g transform="translate(80,140)">
      <rect x="-2" y="88" width="80" height="4" rx="2" fill="#0f3a26" opacity=".2"/>
      <rect x="10" y="-8" width="14" height="10" rx="2" fill="url(#d48-amber)"/>
      <rect x="52" y="-8" width="14" height="10" rx="2" fill="url(#d48-amber)"/>
      <rect x="0" y="0" width="76" height="90" rx="8" fill="url(#d48-battery)"/>
      <rect x="0" y="0" width="76" height="3" rx="1.5" fill="#ffffff" opacity=".2"/>
      <rect x="10" y="14" width="56" height="16" rx="3" fill="#f2b91c"/>
      <text x="38" y="26" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="9" fill="#0f3a26">GREENLIFE</text>
      <text x="38" y="52" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="14" fill="#ffffff">12V</text>
      <text x="38" y="72" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-weight="600" font-size="8" fill="#ffffff" opacity=".7" letter-spacing="1">12AH</text>
      <text x="38" y="115" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-weight="600" font-size="9" fill="#0f3a26" letter-spacing="1">BAT-01</text>
    </g>
    <!-- Battery 2 -->
    <g transform="translate(220,140)">
      <rect x="-2" y="88" width="80" height="4" rx="2" fill="#0f3a26" opacity=".2"/>
      <rect x="10" y="-8" width="14" height="10" rx="2" fill="url(#d48-amber)"/>
      <rect x="52" y="-8" width="14" height="10" rx="2" fill="url(#d48-amber)"/>
      <rect x="0" y="0" width="76" height="90" rx="8" fill="url(#d48-battery)"/>
      <rect x="0" y="0" width="76" height="3" rx="1.5" fill="#ffffff" opacity=".2"/>
      <rect x="10" y="14" width="56" height="16" rx="3" fill="#f2b91c"/>
      <text x="38" y="26" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="9" fill="#0f3a26">GREENLIFE</text>
      <text x="38" y="52" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="14" fill="#ffffff">12V</text>
      <text x="38" y="72" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-weight="600" font-size="8" fill="#ffffff" opacity=".7" letter-spacing="1">12AH</text>
      <text x="38" y="115" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-weight="600" font-size="9" fill="#0f3a26" letter-spacing="1">BAT-02</text>
    </g>
    <!-- Battery 3 -->
    <g transform="translate(360,140)">
      <rect x="-2" y="88" width="80" height="4" rx="2" fill="#0f3a26" opacity=".2"/>
      <rect x="10" y="-8" width="14" height="10" rx="2" fill="url(#d48-amber)"/>
      <rect x="52" y="-8" width="14" height="10" rx="2" fill="url(#d48-amber)"/>
      <rect x="0" y="0" width="76" height="90" rx="8" fill="url(#d48-battery)"/>
      <rect x="0" y="0" width="76" height="3" rx="1.5" fill="#ffffff" opacity=".2"/>
      <rect x="10" y="14" width="56" height="16" rx="3" fill="#f2b91c"/>
      <text x="38" y="26" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="9" fill="#0f3a26">GREENLIFE</text>
      <text x="38" y="52" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="14" fill="#ffffff">12V</text>
      <text x="38" y="72" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-weight="600" font-size="8" fill="#ffffff" opacity=".7" letter-spacing="1">12AH</text>
      <text x="38" y="115" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-weight="600" font-size="9" fill="#0f3a26" letter-spacing="1">BAT-03</text>
    </g>
    <!-- Battery 4 -->
    <g transform="translate(500,140)">
      <rect x="-2" y="88" width="80" height="4" rx="2" fill="#0f3a26" opacity=".2"/>
      <rect x="10" y="-8" width="14" height="10" rx="2" fill="url(#d48-amber)"/>
      <rect x="52" y="-8" width="14" height="10" rx="2" fill="url(#d48-amber)"/>
      <rect x="0" y="0" width="76" height="90" rx="8" fill="url(#d48-battery)"/>
      <rect x="0" y="0" width="76" height="3" rx="1.5" fill="#ffffff" opacity=".2"/>
      <rect x="10" y="14" width="56" height="16" rx="3" fill="#f2b91c"/>
      <text x="38" y="26" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="9" fill="#0f3a26">GREENLIFE</text>
      <text x="38" y="52" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="14" fill="#ffffff">12V</text>
      <text x="38" y="72" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-weight="600" font-size="8" fill="#ffffff" opacity=".7" letter-spacing="1">12AH</text>
      <text x="38" y="115" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-weight="600" font-size="9" fill="#0f3a26" letter-spacing="1">BAT-04</text>
    </g>
  </g>

  <!-- Plus signs between batteries -->
  <g font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="28" fill="#0f3a26">
    <text x="172" y="200" text-anchor="middle" opacity=".55">+</text>
    <text x="312" y="200" text-anchor="middle" opacity=".55">+</text>
    <text x="452" y="200" text-anchor="middle" opacity=".55">+</text>
  </g>

  <!-- equal sign -->
  <text x="592" y="200" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="28" fill="#0f3a26" opacity=".55">=</text>

  <!-- 48V total badge -->
  <g transform="translate(612,140)">
    <rect x="0" y="0" width="90" height="90" rx="14" fill="#0f3a26"/>
    <rect x="4" y="4" width="82" height="82" rx="10" fill="none" stroke="#f2b91c" stroke-width="1.5" opacity=".7"/>
    <text x="45" y="42" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="28" fill="#f2b91c" letter-spacing="-1.5">48V</text>
    <text x="45" y="62" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-weight="600" font-size="8" fill="#ffffff" opacity=".75" letter-spacing="1.5">SISTEM</text>
    <text x="45" y="76" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-weight="600" font-size="8" fill="#ffffff" opacity=".75" letter-spacing="1.5">TOTAL</text>
  </g>

  <!-- caption at bottom -->
  <text x="360" y="330" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="13" fill="#0f3a26" opacity=".8">4 baterai 12V dirangkai seri → sistem 48V — semua baterai harus seragam</text>
</svg>
