<svg viewBox="0 0 720 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagram anatomi sepeda listrik: battery compartment, charger port, controller, motor">
  <defs>
    <linearGradient id="eb-frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a4a30"/>
      <stop offset="1" stop-color="#0a2818"/>
    </linearGradient>
    <linearGradient id="eb-battery" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2b91c"/>
      <stop offset="1" stop-color="#d19b12"/>
    </linearGradient>
    <radialGradient id="eb-glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#f2b91c" stop-opacity=".4"/>
      <stop offset="1" stop-color="#f2b91c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="720" height="440" fill="#0f3a26" rx="20"/>

  <!-- grid dots -->
  <g opacity=".08" fill="#ffffff">
    <circle cx="60" cy="60" r="1.5"/><circle cx="140" cy="60" r="1.5"/><circle cx="220" cy="60" r="1.5"/><circle cx="300" cy="60" r="1.5"/><circle cx="380" cy="60" r="1.5"/><circle cx="460" cy="60" r="1.5"/><circle cx="540" cy="60" r="1.5"/><circle cx="620" cy="60" r="1.5"/>
    <circle cx="60" cy="140" r="1.5"/><circle cx="140" cy="140" r="1.5"/><circle cx="220" cy="140" r="1.5"/><circle cx="300" cy="140" r="1.5"/><circle cx="380" cy="140" r="1.5"/><circle cx="460" cy="140" r="1.5"/><circle cx="540" cy="140" r="1.5"/><circle cx="620" cy="140" r="1.5"/>
    <circle cx="60" cy="380" r="1.5"/><circle cx="140" cy="380" r="1.5"/><circle cx="220" cy="380" r="1.5"/><circle cx="300" cy="380" r="1.5"/><circle cx="380" cy="380" r="1.5"/><circle cx="460" cy="380" r="1.5"/><circle cx="540" cy="380" r="1.5"/><circle cx="620" cy="380" r="1.5"/>
  </g>

  <text x="40" y="52" font-family="'Geist Mono', ui-monospace, monospace" font-weight="600" font-size="11" fill="#f2b91c" opacity=".85" letter-spacing="2">ANATOMI SEPEDA LISTRIK</text>
  <text x="40" y="76" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="24" fill="#ffffff" letter-spacing="-.5">Yang perlu dicek sebelum ganti baterai.</text>

  <!-- battery compartment glow -->
  <circle cx="360" cy="270" r="110" fill="url(#eb-glow)"/>

  <!-- ground line -->
  <line x1="80" y1="380" x2="640" y2="380" stroke="#ffffff" stroke-opacity=".15" stroke-dasharray="2 6"/>

  <!-- rear wheel -->
  <circle cx="180" cy="340" r="52" fill="none" stroke="#ffffff" stroke-opacity=".7" stroke-width="3"/>
  <circle cx="180" cy="340" r="52" fill="#0a2818"/>
  <circle cx="180" cy="340" r="52" fill="none" stroke="#ffffff" stroke-opacity=".7" stroke-width="2.5"/>
  <circle cx="180" cy="340" r="16" fill="#ffffff" stroke="#f2b91c" stroke-width="2"/>
  <circle cx="180" cy="340" r="7" fill="#0a2818"/>
  <g stroke="#ffffff" stroke-width="1.2" opacity=".5">
    <line x1="180" y1="292" x2="180" y2="388"/>
    <line x1="132" y1="340" x2="228" y2="340"/>
    <line x1="146" y1="306" x2="214" y2="374"/>
    <line x1="214" y1="306" x2="146" y2="374"/>
  </g>

  <!-- front wheel -->
  <circle cx="540" cy="340" r="52" fill="#0a2818" stroke="#ffffff" stroke-opacity=".7" stroke-width="3"/>
  <circle cx="540" cy="340" r="16" fill="#ffffff" stroke="#f2b91c" stroke-width="2"/>
  <circle cx="540" cy="340" r="7" fill="#0a2818"/>
  <g stroke="#ffffff" stroke-width="1.2" opacity=".5">
    <line x1="540" y1="292" x2="540" y2="388"/>
    <line x1="492" y1="340" x2="588" y2="340"/>
    <line x1="506" y1="306" x2="574" y2="374"/>
    <line x1="574" y1="306" x2="506" y2="374"/>
  </g>

  <!-- frame down tube (with battery mount) -->
  <path d="M 240 200 L 330 300 L 480 300 L 500 220 Z" fill="url(#eb-frame)" stroke="#3fb968" stroke-width="1.5" opacity=".95"/>

  <!-- seat tube -->
  <line x1="330" y1="300" x2="290" y2="200" stroke="#ffffff" stroke-opacity=".85" stroke-width="6" stroke-linecap="round"/>
  <!-- seat -->
  <rect x="260" y="192" width="60" height="10" rx="4" fill="#ffffff"/>

  <!-- head tube + fork -->
  <line x1="500" y1="220" x2="530" y2="160" stroke="#ffffff" stroke-opacity=".85" stroke-width="6" stroke-linecap="round"/>
  <line x1="510" y1="220" x2="540" y2="340" stroke="#ffffff" stroke-opacity=".85" stroke-width="5" stroke-linecap="round"/>
  <!-- handlebar -->
  <path d="M 500 160 L 560 160 L 570 168" fill="none" stroke="#ffffff" stroke-opacity=".85" stroke-width="5" stroke-linecap="round"/>
  <path d="M 530 160 L 490 148" stroke="#ffffff" stroke-opacity=".85" stroke-width="5" stroke-linecap="round"/>

  <!-- chainstay -->
  <line x1="330" y1="300" x2="180" y2="340" stroke="#ffffff" stroke-opacity=".85" stroke-width="5" stroke-linecap="round"/>

  <!-- BATTERY (highlighted in amber) -->
  <g transform="translate(300,220)">
    <rect x="0" y="0" width="150" height="66" rx="10" fill="url(#eb-battery)" stroke="#ffffff" stroke-width="2"/>
    <rect x="0" y="0" width="150" height="4" rx="2" fill="#ffffff" opacity=".3"/>
    <rect x="8" y="10" width="134" height="18" rx="4" fill="#0f3a26"/>
    <text x="75" y="24" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="12" fill="#f2b91c">GREENLIFE</text>
    <text x="75" y="50" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="18" fill="#0f3a26" letter-spacing="-.5">48V system</text>
  </g>

  <!-- motor at rear hub -->
  <circle cx="180" cy="340" r="24" fill="#0f3a26" stroke="#f2b91c" stroke-width="2"/>
  <text x="180" y="344" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-weight="600" font-size="8" fill="#f2b91c" letter-spacing="1">MOTOR</text>

  <!-- controller box -->
  <rect x="256" y="288" width="46" height="24" rx="4" fill="#0f3a26" stroke="#3fb968" stroke-width="1.5"/>
  <text x="279" y="303" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-weight="600" font-size="8" fill="#3fb968" letter-spacing="1">CTRL</text>

  <!-- charging port -->
  <rect x="472" y="260" width="18" height="10" rx="2" fill="#f2b91c"/>
  <line x1="490" y1="265" x2="500" y2="265" stroke="#f2b91c" stroke-width="2"/>

  <!-- CALLOUTS -->
  <!-- Battery callout -->
  <g>
    <line x1="378" y1="220" x2="378" y2="120" stroke="#f2b91c" stroke-width="1.5" stroke-dasharray="3 4"/>
    <circle cx="378" cy="220" r="4" fill="#f2b91c"/>
    <rect x="308" y="94" width="240" height="28" rx="6" fill="#f2b91c"/>
    <text x="428" y="113" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="13" fill="#0f3a26">BATTERY COMPARTMENT</text>
  </g>

  <!-- Motor callout -->
  <g>
    <line x1="180" y1="316" x2="120" y2="260" stroke="#3fb968" stroke-width="1.5" stroke-dasharray="3 4"/>
    <circle cx="180" cy="316" r="4" fill="#3fb968"/>
    <rect x="30" y="240" width="140" height="26" rx="5" fill="#3fb968"/>
    <text x="100" y="257" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="12" fill="#0f3a26">Motor + Voltase</text>
  </g>

  <!-- Charger port callout -->
  <g>
    <line x1="490" y1="260" x2="580" y2="200" stroke="#3fb968" stroke-width="1.5" stroke-dasharray="3 4"/>
    <circle cx="490" cy="260" r="4" fill="#3fb968"/>
    <rect x="546" y="180" width="150" height="26" rx="5" fill="#3fb968"/>
    <text x="621" y="197" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="12" fill="#0f3a26">Charger Port + Kabel</text>
  </g>

  <!-- Controller callout -->
  <g>
    <line x1="278" y1="288" x2="228" y2="240" stroke="#3fb968" stroke-width="1.5" stroke-dasharray="3 4"/>
    <circle cx="278" cy="288" r="4" fill="#3fb968"/>
    <rect x="146" y="220" width="130" height="26" rx="5" fill="#3fb968"/>
    <text x="211" y="237" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="12" fill="#0f3a26">Controller / Sistem</text>
  </g>

  <!-- bottom caption -->
  <text x="360" y="418" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="12" fill="#ffffff" opacity=".7" letter-spacing=".3">Cek voltase sistem, ruang baterai, tipe soket &amp; kabel, charger yang cocok — sebelum beli.</text>
</svg>
