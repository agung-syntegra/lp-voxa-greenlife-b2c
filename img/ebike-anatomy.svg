<svg viewBox="0 0 1670 1022" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" aria-label="Anatomi sepeda listrik moped: battery compartment, motor, controller, charger port">

  <style>
    /* Caption bawah — dua versi (desktop 1-line, mobile 2-line) toggled via media query */
    .cap-mob { display: none; }
    @media (max-width: 640px) {
      .cap-desk { display: none; }
      .cap-mob { display: inline; }
    }
  </style>

  <!-- Background: moped line-art image -->
  <image href="moped-anatomy.png" xlink:href="moped-anatomy.png" x="0" y="0" width="1670" height="1022" preserveAspectRatio="xMidYMid slice"/>

  <!-- Title: kicker + subtitle at top-left (enlarged) -->
  <text x="50" y="86" font-family="'Geist Mono', ui-monospace, monospace" font-weight="600" font-size="36" fill="#f2b91c" opacity=".9" letter-spacing="6">ANATOMI SEPEDA LISTRIK</text>
  <text x="50" y="160" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="54" fill="#ffffff" letter-spacing="-.5">Yang perlu dicek sebelum ganti baterai.</text>

  <!-- Battery compartment: diagonal dashed line from right pill to target dot -->
  <line x1="1310" y1="427" x2="835" y2="635" stroke="#f2b91c" stroke-width="2.5" stroke-dasharray="7 6" opacity=".9"/>
  <circle cx="1310" cy="427" r="6" fill="#f2b91c"/>
  <circle cx="835" cy="635" r="8" fill="#f2b91c" stroke="#ffffff" stroke-width="2"/>

  <!-- 48V amber block dekat deck sepeda listrik -->
  <g transform="translate(730,640)">
    <rect x="0" y="0" width="210" height="120" rx="10" fill="#f2b91c" stroke="#ffffff" stroke-width="2"/>
    <rect x="8" y="10" width="194" height="36" rx="6" fill="#0f3a26"/>
    <text x="105" y="37" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="20" fill="#f2b91c">GREENLIFE</text>
    <text x="105" y="93" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="32" fill="#0f3a26" letter-spacing="-.5">48V system</text>
  </g>

  <!-- BATTERY COMPARTMENT pill (right side, geser kiri sedikit) -->
  <g>
    <rect x="1310" y="390" width="300" height="75" rx="12" fill="#f2b91c"/>
    <text x="1460" y="434" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="22" fill="#0f3a26" letter-spacing=".02em">BATTERY COMPARTMENT</text>
  </g>

  <!-- Charger Port + Kabel (left-upper) -->
  <g>
    <line x1="312" y1="308" x2="675" y2="625" stroke="#3fb968" stroke-width="2.5" stroke-dasharray="7 6" opacity=".9"/>
    <circle cx="312" cy="308" r="6" fill="#3fb968"/>
    <circle cx="675" cy="625" r="12" fill="#f2b91c" stroke="#3fb968" stroke-width="2.5"/>
    <rect x="30" y="280" width="280" height="55" rx="10" fill="#3fb968"/>
    <text x="170" y="317" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="22" fill="#0f3a26">Charger Port + Kabel</text>
  </g>

  <!-- Controller / Sistem (di atas jok) — titik CTRL di bawah jok -->
  <g>
    <line x1="651" y1="335" x2="651" y2="470" stroke="#3fb968" stroke-width="2.5" stroke-dasharray="7 6" opacity=".9"/>
    <circle cx="651" cy="335" r="6" fill="#3fb968"/>
    <rect x="610" y="470" width="82" height="42" rx="6" fill="#0f3a26" stroke="#3fb968" stroke-width="2.5"/>
    <text x="651" y="498" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-weight="600" font-size="17" fill="#3fb968" letter-spacing="1">CTRL</text>
    <rect x="501" y="280" width="300" height="55" rx="10" fill="#3fb968"/>
    <text x="651" y="316" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="22" fill="#0f3a26">Controller / Sistem</text>
  </g>

  <!-- Motor + Voltase (left-lower) — dekat rear wheel hub -->
  <g>
    <line x1="280" y1="728" x2="450" y2="810" stroke="#3fb968" stroke-width="2.5" stroke-dasharray="7 6" opacity=".9"/>
    <circle cx="280" cy="728" r="6" fill="#3fb968"/>
    <circle cx="450" cy="810" r="52" fill="none" stroke="#f2b91c" stroke-width="4"/>
    <rect x="30" y="700" width="250" height="55" rx="10" fill="#3fb968"/>
    <text x="155" y="737" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="22" fill="#0f3a26">Motor + Voltase</text>
  </g>

  <!-- Ground line (dashed, subtle green) -->
  <line x1="150" y1="880" x2="1520" y2="880" stroke="#3fb968" stroke-width="2" stroke-dasharray="4 6" opacity=".55"/>

  <!-- Bottom caption — desktop (1 line) -->
  <text class="cap-desk" x="835" y="960" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="24" fill="#ffffff" opacity=".9">Cek voltase sistem, ruang baterai, tipe soket &amp; kabel, charger yang cocok — sebelum beli.</text>

  <!-- Bottom caption — mobile (2 lines, font-size moderate) -->
  <text class="cap-mob" x="835" y="935" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="36" fill="#ffffff" opacity=".9">
    <tspan x="835" dy="0">Cek voltase sistem, ruang baterai, tipe soket &amp; kabel,</tspan>
    <tspan x="835" dy="1.2em">charger yang cocok — sebelum beli.</tspan>
  </text>

</svg>
