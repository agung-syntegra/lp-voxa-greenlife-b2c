<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ilustrasi baterai mulai drop - kapasitas menurun bertahap">
  <defs>
    <linearGradient id="bd-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a4a30"/>
      <stop offset="1" stop-color="#0a2818"/>
    </linearGradient>
    <linearGradient id="bd-full" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3fb968"/>
      <stop offset="1" stop-color="#2d8f4e"/>
    </linearGradient>
    <linearGradient id="bd-warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2b91c"/>
      <stop offset="1" stop-color="#d19b12"/>
    </linearGradient>
    <linearGradient id="bd-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e26a5c"/>
      <stop offset="1" stop-color="#c94b3b"/>
    </linearGradient>
  </defs>

  <rect width="400" height="300" fill="#eef3e6" rx="16"/>

  <!-- 4 mini batteries showing decline -->
  <g transform="translate(30,80)">
    <!-- Battery 1: full -->
    <g>
      <rect x="14" y="-6" width="10" height="6" rx="1.5" fill="url(#bd-body)"/>
      <rect x="42" y="-6" width="10" height="6" rx="1.5" fill="url(#bd-body)"/>
      <rect x="0" y="0" width="66" height="90" rx="6" fill="url(#bd-body)"/>
      <rect x="6" y="6" width="54" height="78" rx="3" fill="#0a2818"/>
      <rect x="6" y="6" width="54" height="78" rx="3" fill="url(#bd-full)"/>
      <text x="33" y="52" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="14" fill="#ffffff">100%</text>
      <text x="33" y="112" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-weight="600" font-size="9" fill="#0f3a26" opacity=".7" letter-spacing="1">BARU</text>
    </g>
  </g>

  <g transform="translate(120,80)">
    <!-- Battery 2: 70% -->
    <g>
      <rect x="14" y="-6" width="10" height="6" rx="1.5" fill="url(#bd-body)"/>
      <rect x="42" y="-6" width="10" height="6" rx="1.5" fill="url(#bd-body)"/>
      <rect x="0" y="0" width="66" height="90" rx="6" fill="url(#bd-body)"/>
      <rect x="6" y="6" width="54" height="78" rx="3" fill="#0a2818"/>
      <rect x="6" y="29" width="54" height="55" rx="3" fill="url(#bd-warn)"/>
      <text x="33" y="52" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="14" fill="#ffffff">70%</text>
      <text x="33" y="112" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-weight="600" font-size="9" fill="#0f3a26" opacity=".7" letter-spacing="1">MULAI TURUN</text>
    </g>
  </g>

  <g transform="translate(210,80)">
    <!-- Battery 3: 40% -->
    <g>
      <rect x="14" y="-6" width="10" height="6" rx="1.5" fill="url(#bd-body)"/>
      <rect x="42" y="-6" width="10" height="6" rx="1.5" fill="url(#bd-body)"/>
      <rect x="0" y="0" width="66" height="90" rx="6" fill="url(#bd-body)"/>
      <rect x="6" y="6" width="54" height="78" rx="3" fill="#0a2818"/>
      <rect x="6" y="53" width="54" height="31" rx="3" fill="url(#bd-danger)"/>
      <text x="33" y="52" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="14" fill="#ffffff">40%</text>
      <text x="33" y="112" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-weight="600" font-size="9" fill="#c94b3b" opacity=".85" letter-spacing="1">DROP</text>
    </g>
  </g>

  <g transform="translate(300,80)">
    <!-- Battery 4: dead - with warning -->
    <g>
      <rect x="14" y="-6" width="10" height="6" rx="1.5" fill="url(#bd-body)" opacity=".7"/>
      <rect x="42" y="-6" width="10" height="6" rx="1.5" fill="url(#bd-body)" opacity=".7"/>
      <rect x="0" y="0" width="66" height="90" rx="6" fill="url(#bd-body)" opacity=".85"/>
      <rect x="6" y="6" width="54" height="78" rx="3" fill="#0a2818"/>
      <rect x="6" y="78" width="54" height="6" rx="1.5" fill="url(#bd-danger)" opacity=".6"/>
      <g transform="translate(33,45)">
        <circle r="14" fill="#c94b3b"/>
        <text x="0" y="5" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="18" fill="#ffffff">!</text>
      </g>
      <text x="33" y="112" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-weight="600" font-size="9" fill="#c94b3b" letter-spacing="1">HABIS</text>
    </g>
  </g>

  <!-- arrow line at top -->
  <path d="M 60 40 L 340 40" stroke="#c94b3b" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#bd-arrowhead)"/>
  <defs>
    <marker id="bd-arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#c94b3b"/>
    </marker>
  </defs>

  <!-- title -->
  <text x="200" y="30" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-weight="600" font-size="11" fill="#c94b3b" letter-spacing="2">SIKLUS BATERAI YANG MULAI DROP</text>

  <!-- caption -->
  <text x="200" y="228" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="14" fill="#0f3a26" letter-spacing="-.3">Baterai lama nggak mati mendadak.</text>
  <text x="200" y="252" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="500" font-size="12" fill="#4d6659">Kapasitasnya menurun pelan-pelan,</text>
  <text x="200" y="270" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="500" font-size="12" fill="#4d6659">sampai pemakaian harian terganggu.</text>
</svg>
